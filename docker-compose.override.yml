# ============================================================
# Override untuk Development Lokal
# File ini otomatis di-load oleh docker-compose dan TIDAK
# perlu di-commit jika berisi konfigurasi lokal sensitif.
# ============================================================
services:
  app:
    build:
      target: development   # Gunakan stage development (ada nest CLI & devDeps)
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      JWT_SECRET: dev_secret_untuk_local_saja_jangan_di_production
      ALLOWED_ORIGINS: https://dlinzi.web.id,http://localhost:3000,http://localhost:3001
    # Gunakan path absolut ke nest CLI — aman meskipun volume host di-mount
    command: ["node_modules/.bin/nest", "start", "--watch"]
    volumes:
      - .:/app                    # Mount source code untuk hot reload
      - /app/node_modules         # Anonymous volume — lindungi node_modules container
      - ./storage/uploads:/app/storage/uploads

