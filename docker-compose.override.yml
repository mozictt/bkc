# ============================================================
# Override untuk Development Lokal
# File ini otomatis di-load oleh docker-compose dan TIDAK
# perlu di-commit jika berisi konfigurasi lokal sensitif.
# ============================================================
services:
  app:
    build:
      target: builder
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      JWT_SECRET: dev_secret_untuk_local_saja_jangan_di_production
      ALLOWED_ORIGINS: https://dlinzi.web.id,http://localhost:3000,http://localhost:3001
    command: ["node", "-r", "ts-node/register", "-r", "tsconfig-paths/register", "src/main.ts"]
    volumes:
      - .:/app
      - /app/node_modules
      - app_uploads:/app/storage/uploads
